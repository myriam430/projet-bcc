<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription</title>
  <link rel="stylesheet" href="src/output.css">



  <style>
    :root {
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .text-gradient-primary {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

   .gradient-primary{
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%) ;
    }
  </style>
</head>

<body class="bg-gray-50">


  <div class="flex flex-col md:flex-row justify-center items-center gap-8 min-h-screen p-4">

    <!-- Formulaire d'inscription -->
    <form class="bg-white p-6 rounded-2xl shadow w-full max-w-md">
      <h2 class="text-gradient-primary font-semibold text-center  mb-6">Connexion</h2>

      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" placeholder="Email professionnel"
          class="mt-1 w-full p-2 rounded border border-gray-300 focus:ring-2 focus:ring-indigo-400 outline-none"
          required>
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Mot de passe sécurisé"
          class="mt-1 w-full p-2 rounded border border-gray-300 focus:ring-2 focus:ring-indigo-400 outline-none"
          required>
      </div>

      <button type="submit"
        class="w-full gradient-primary text-white py-2 rounded  transition duration-300">
        Se connecter
      </button>
    </form>




</body>

</html>
