      <!-- Panier -->

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="1.5" stroke="currentColor"

        </svg>

      <!-- Aide -->

        <div

          ?

  </div>

  <!-- Header avec slider -->

      <img src="/image/automobil.jpg" alt="drone" class="w-full h-[80vh] object-cover flex-shrink-0" />
     

    </div>

    <!-- Texte superposé -->
    <div class="absolute inset-0 flex flex-col items-start justify-center text-white px-4 text-center">
      <h1 class="text-3xl md:text-5xl font-bold fade-in-up">Bienvenue sur notre boutique</h1>
      <p class="mt-4 text-lg md:text-xl fade-in-up">Les meilleurs smartphones aux meilleurs prix</p>
      <button

        Acheter maintenant
      </button>
    </div>

    <div class="absolute inset-0 flex justify-end items-start m-4">
    <button id="hamburgerBtn" class=" text-white md:hidden focus:outline-none">
  <!-- Icône Heroicons (menu) -->
  <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none"

  </header>

  <!-- Script slider automatique -->
  <script>
    let currentIndex = 0;
    const images = document.querySelectorAll('#slider img');
    const totalImages = images.length;

    function showNextImage() {
      currentIndex = (currentIndex + 1) % totalImages;
      const offset = -currentIndex * 100;
      document.querySelector('#slider').style.transform = `translateX(${offset}%)`;
    }

    setInterval(showNextImage, 3000);
  </script>
